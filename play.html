<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maze Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0f0f23; color: #fff;
  min-height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
header {
  background: #1a1a2e; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
header h1 { font-size: 1.1em; font-weight: 600; }
.header-stats { display: flex; gap: 16px; font-size: 0.85em; }
.stat { display: flex; align-items: center; gap: 4px; }
.stat-label { opacity: 0.6; font-size: 0.8em; text-transform: uppercase; }
.stat-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.game-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 8px; position: relative;
}
canvas { border-radius: 4px; }
.controls-bar {
  background: #1a1a2e; padding: 8px 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  flex-wrap: wrap;
}
.controls-bar select, .controls-bar input {
  padding: 6px 8px; border: 1px solid #333; border-radius: 6px;
  font-size: 0.85em; background: #16213e; color: #fff;
}
.controls-bar label { font-size: 0.7em; text-transform: uppercase; opacity: 0.6; }
.ctrl-group { display: flex; flex-direction: column; gap: 2px; }
.btn {
  padding: 8px 16px; border: none; border-radius: 6px;
  font-size: 0.85em; font-weight: 600; cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn-play { background: #e94560; color: #fff; }
.btn-hint { background: #16213e; color: #fff; border: 1px solid #333; }
.btn-back { background: transparent; color: #fff; opacity: 0.7; font-size: 0.8em; text-decoration: none; }
.btn-back:hover { opacity: 1; }

/* D-pad */
.dpad {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  width: 160px; height: 160px; display: none;
}
.dpad-btn {
  position: absolute; width: 52px; height: 52px;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 1.4em; color: rgba(255,255,255,0.7); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.dpad-btn:active { background: rgba(255,255,255,0.25); }
.dpad-up { top: 0; left: 50%; transform: translateX(-50%); }
.dpad-down { bottom: 0; left: 50%; transform: translateX(-50%); }
.dpad-left { top: 50%; left: 0; transform: translateY(-50%); }
.dpad-right { top: 50%; right: 0; transform: translateY(-50%); }

/* Win overlay */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.win-card {
  background: #1a1a2e; border-radius: 16px; padding: 32px 40px;
  text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  max-width: 90vw;
}
.win-card h2 { font-size: 1.8em; margin-bottom: 8px; }
.win-card .win-emoji { font-size: 3em; margin-bottom: 12px; }
.win-stats { margin: 16px 0; font-size: 1.1em; line-height: 1.8; }
.win-stats span { font-weight: 700; color: #e94560; }

@media (hover: none) and (pointer: coarse) {
  .dpad { display: block; }
  .game-area { padding-bottom: 180px; }
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="btn-back">&larr; Back</a>
    <h1>Maze Runner</h1>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timer">0:00</span></div>
    <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
  </div>
</header>
<div class="controls-bar">
  <div class="ctrl-group">
    <label>Size</label>
    <select id="size">
      <option value="5">5 &times; 5 (Easy)</option>
      <option value="8">8 &times; 8</option>
      <option value="10" selected>10 &times; 10</option>
      <option value="15">15 &times; 15</option>
      <option value="20">20 &times; 20 (Hard)</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Theme</label>
    <select id="theme">
      <option value="neon">Neon</option>
      <option value="dungeon">Dungeon</option>
      <option value="midnight">Midnight</option>
      <option value="retro">Retro</option>
      <option value="blueprint">Blueprint</option>
      <option value="ice">Ice</option>
      <option value="classic">Classic</option>
      <option value="parchment">Parchment</option>
    </select>
  </div>
  <button class="btn btn-play" onclick="newGame()">New Game</button>
  <button class="btn btn-hint" onclick="showHint()">Hint</button>
</div>
<div class="game-area">
  <canvas id="canvas"></canvas>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">&uarr;</div>
  <div class="dpad-btn dpad-down" data-dir="down">&darr;</div>
  <div class="dpad-btn dpad-left" data-dir="left">&larr;</div>
  <div class="dpad-btn dpad-right" data-dir="right">&rarr;</div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji">&#127942;</div>
    <h2>You Made It!</h2>
    <div class="win-stats">
      Time: <span id="winTime">0:00</span><br>
      Moves: <span id="winMoves">0</span>
    </div>
    <button class="btn btn-play" onclick="newGame()" style="margin-top:12px">Play Again</button>
  </div>
</div>

<script src="maze-bundle.js?v=5"></script>
<script>
const { RectangularMaze, Kruskal, getTheme } = MazeGen;

// Game state
let maze, width, height, cellSize;
let playerRow, playerCol;
let goalRow, goalCol;
let moveCount = 0;
let timerStart = 0, timerInterval = null;
let gameWon = false;
let hintTimeout = null;
let showingHint = false;
// Passability: passable[row][col] = { up, down, left, right }
let passable = [];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function vertexIndex(r, c) { return r * width + c; }

function buildPassable() {
  passable = [];
  for (let r = 0; r < height; r++) {
    passable[r] = [];
    for (let c = 0; c < width; c++) {
      const v = vertexIndex(r, c);
      const walls = maze.adjacencylist[v];
      // A direction is passable if there's NO wall edge to that neighbor
      const hasWallTo = (nv) => walls.some(e => e[0] === nv);
      passable[r][c] = {
        up:    r > 0            && !hasWallTo(vertexIndex(r - 1, c)),
        down:  r < height - 1   && !hasWallTo(vertexIndex(r + 1, c)),
        left:  c > 0            && !hasWallTo(vertexIndex(r, c - 1)),
        right: c < width - 1    && !hasWallTo(vertexIndex(r, c + 1)),
      };
    }
  }
}

function calcCellSize() {
  const area = document.querySelector('.game-area');
  const maxW = area.clientWidth - 16;
  const maxH = area.clientHeight - 16;
  cellSize = Math.floor(Math.min(maxW / width, maxH / height));
  cellSize = Math.max(cellSize, 10);
  canvas.width = width * cellSize;
  canvas.height = height * cellSize;
}

function draw() {
  const theme = getTheme(document.getElementById('theme').value);
  const cw = cellSize;

  // Background
  ctx.fillStyle = theme.backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hint: solution path
  if (showingHint) {
    drawSolutionHint(theme);
  }

  // Walls
  ctx.strokeStyle = theme.wallColor;
  ctx.lineWidth = Math.max(2, cw / 10);
  ctx.lineCap = 'round';

  for (let r = 0; r < height; r++) {
    for (let c = 0; c < width; c++) {
      const x = c * cw, y = r * cw;
      const p = passable[r][c];
      if (!p.up)    { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cw, y); ctx.stroke(); }
      if (!p.left)  { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cw); ctx.stroke(); }
      // Right edge of maze
      if (c === width - 1) { ctx.beginPath(); ctx.moveTo(x + cw, y); ctx.lineTo(x + cw, y + cw); ctx.stroke(); }
      // Bottom edge of maze
      if (r === height - 1) { ctx.beginPath(); ctx.moveTo(x, y + cw); ctx.lineTo(x + cw, y + cw); ctx.stroke(); }
    }
  }

  // Goal marker
  const gx = goalCol * cw + cw / 2, gy = goalRow * cw + cw / 2;
  ctx.fillStyle = theme.solutionColor;
  ctx.globalAlpha = 0.3 + 0.15 * Math.sin(Date.now() / 300);
  ctx.beginPath(); ctx.arc(gx, gy, cw * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = theme.solutionColor;
  ctx.beginPath(); ctx.arc(gx, gy, cw * 0.15, 0, Math.PI * 2); ctx.fill();

  // Player
  const px = playerCol * cw + cw / 2, py = playerRow * cw + cw / 2;
  ctx.fillStyle = theme.breakColor || '#00ffff';
  ctx.shadowColor = theme.breakColor || '#00ffff';
  ctx.shadowBlur = cw * 0.4;
  ctx.beginPath(); ctx.arc(px, py, cw * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  if (!gameWon) requestAnimationFrame(draw);
}

function drawSolutionHint(theme) {
  // Walk the solution from the maze
  const cw = cellSize;
  ctx.strokeStyle = theme.solutionColor;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(2, cw / 5);
  ctx.lineCap = 'round';
  for (let u = 0; u < maze.vertices; u++) {
    for (const edge of maze.solution[u]) {
      const v = edge[0];
      const r1 = Math.floor(u / width), c1 = u % width;
      const r2 = Math.floor(v / width), c2 = v % width;
      ctx.beginPath();
      ctx.moveTo(c1 * cw + cw / 2, r1 * cw + cw / 2);
      ctx.lineTo(c2 * cw + cw / 2, r2 * cw + cw / 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function movePlayer(dir) {
  if (gameWon) return;
  const p = passable[playerRow][playerCol];
  let nr = playerRow, nc = playerCol;
  if (dir === 'up' && p.up)       nr--;
  else if (dir === 'down' && p.down)  nr++;
  else if (dir === 'left' && p.left)  nc--;
  else if (dir === 'right' && p.right) nc++;
  else return; // blocked

  playerRow = nr; playerCol = nc;
  moveCount++;
  document.getElementById('moves').textContent = moveCount;

  if (playerRow === goalRow && playerCol === goalCol) {
    winGame();
  }
}

function winGame() {
  gameWon = true;
  clearInterval(timerInterval);
  // Final draw
  draw();
  document.getElementById('winTime').textContent = document.getElementById('timer').textContent;
  document.getElementById('winMoves').textContent = moveCount;
  setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 300);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('timer').textContent = m + ':' + String(s).padStart(2, '0');
}

function showHint() {
  if (gameWon) return;
  showingHint = true;
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => { showingHint = false; }, 2000);
}

function newGame() {
  document.getElementById('winOverlay').classList.remove('show');
  const size = parseInt(document.getElementById('size').value);
  width = size; height = size;
  playerRow = 0; playerCol = 0;
  goalRow = height - 1; goalCol = width - 1;
  moveCount = 0; gameWon = false; showingHint = false;
  document.getElementById('moves').textContent = '0';

  const seed = (Math.random() * 0xffffffff) >>> 0;
  maze = new RectangularMaze(width, height);
  maze.initializeGraph();
  const algo = new Kruskal(seed);
  maze.generateMaze(algo);

  buildPassable();
  calcCellSize();

  clearInterval(timerInterval);
  timerStart = Date.now();
  timerInterval = setInterval(updateTimer, 200);
  document.getElementById('timer').textContent = '0:00';

  draw();
}

// Keyboard
document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right' };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); movePlayer(dir); }
});

// D-pad touch
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  // Handle both touch and click
  btn.addEventListener('touchstart', e => { e.preventDefault(); movePlayer(dir); });
  btn.addEventListener('mousedown', e => { e.preventDefault(); movePlayer(dir); });
});

// Swipe support
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
});
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  const minSwipe = 20;
  if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    movePlayer(dx > 0 ? 'right' : 'left');
  } else {
    movePlayer(dy > 0 ? 'down' : 'up');
  }
});

// Theme change re-renders
document.getElementById('theme').addEventListener('change', () => { if (!gameWon) draw(); });

// Resize
window.addEventListener('resize', () => { calcCellSize(); if (!gameWon) draw(); });

// Start
newGame();
</script>
</body>
</html>
