<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maze Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0f0f23; color: #fff;
  min-height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
header {
  background: #1a1a2e; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
header h1 { font-size: 1.1em; font-weight: 600; }
.header-stats { display: flex; gap: 16px; font-size: 0.85em; }
.stat { display: flex; align-items: center; gap: 4px; }
.stat-label { opacity: 0.6; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.game-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 8px; position: relative;
}
canvas { border-radius: 4px; }
.controls-bar {
  background: #1a1a2e; padding: 8px 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  flex-wrap: wrap;
}
.controls-bar select, .controls-bar input {
  padding: 6px 8px; border: 1px solid #333; border-radius: 6px;
  font-size: 0.85em; background: #16213e; color: #fff;
}
.controls-bar label { font-size: 0.7em; text-transform: uppercase; opacity: 0.6; }
.ctrl-group { display: flex; flex-direction: column; gap: 2px; }
.btn {
  padding: 8px 16px; border: none; border-radius: 6px;
  font-size: 0.85em; font-weight: 600; cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn-play { background: #e94560; color: #fff; }
.btn-hint { background: #16213e; color: #fff; border: 1px solid #333; }
.btn-music { background: #16213e; color: #fff; border: 1px solid #333; min-width: 32px; }
.btn-back { background: transparent; color: #fff; opacity: 0.7; font-size: 0.8em; text-decoration: none; }
.btn-back:hover { opacity: 1; }

/* Joystick */
.joystick-zone {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 140px; display: none;
  -webkit-tap-highlight-color: transparent;
}
.joystick-base {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
  border-radius: 50%;
}
.joystick-knob {
  position: absolute; width: 56px; height: 56px;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.4);
  border-radius: 50%; pointer-events: none;
  transition: transform 0.05s;
}
.joystick-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 0.6em; opacity: 0.4; white-space: nowrap;
}

/* Overlays */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.win-card {
  background: #1a1a2e; border-radius: 16px; padding: 32px 40px;
  text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  max-width: 90vw;
}
.win-card h2 { font-size: 1.8em; margin-bottom: 8px; }
.win-card .win-emoji { font-size: 3em; margin-bottom: 12px; }
.win-stats { margin: 16px 0; font-size: 1.1em; line-height: 1.8; }
.win-stats span { font-weight: 700; color: #e94560; }

@media (hover: none) and (pointer: coarse) {
  .joystick-zone { display: block; }
  .game-area { padding-bottom: 180px; }
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="btn-back">&larr; Back</a>
    <h1>Maze Runner</h1>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="lives" style="color:#e94560">&#9829;&#9829;&#9829;</span></div>
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timer">0:00</span></div>
    <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
  </div>
</header>
<div class="controls-bar">
  <div class="ctrl-group">
    <label>Shape</label>
    <select id="shape">
      <option value="hex" selected>Hexagonal</option>
      <option value="rect">Rectangular</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Size</label>
    <select id="size"></select>
  </div>
  <div class="ctrl-group">
    <label>Theme</label>
    <select id="theme">
      <option value="neon">Neon</option>
      <option value="dungeon">Dungeon</option>
      <option value="midnight">Midnight</option>
      <option value="retro">Retro</option>
      <option value="blueprint">Blueprint</option>
      <option value="ice">Ice</option>
      <option value="classic">Classic</option>
      <option value="parchment">Parchment</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Enemies</label>
    <select id="enemyCount">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
    </select>
  </div>
  <button class="btn btn-play" onclick="newGame()">New Game</button>
  <button class="btn btn-hint" onclick="showHint()">Hint</button>
  <button class="btn btn-music" id="musicBtn" onclick="toggleMusic()" style="opacity:0.4">&#9835; Music</button>
</div>
<div class="game-area">
  <canvas id="canvas"></canvas>
</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"></div>
  <div class="joystick-knob" id="joystickKnob"></div>
  <div class="joystick-label">drag to move</div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji" id="endEmoji">&#127942;</div>
    <h2 id="endTitle">You Made It!</h2>
    <div class="win-stats">
      Time: <span id="winTime">0:00</span><br>
      Moves: <span id="winMoves">0</span>
    </div>
    <button class="btn btn-play" onclick="newGame()" style="margin-top:12px">Play Again</button>
  </div>
</div>

<script src="maze-bundle.js?v=5"></script>
<script>
const { RectangularMaze, HexagonalMaze, Kruskal, getTheme } = MazeGen;

// ===== Size options per shape =====
const SIZE_OPTIONS = {
  hex:  [{v:3,l:'3 (Easy)'},{v:4,l:'4'},{v:5,l:'5 (Medium)'},{v:7,l:'7 (Hard)'}],
  rect: [{v:5,l:'5\u00d75 (Easy)'},{v:8,l:'8\u00d78'},{v:10,l:'10\u00d710'},{v:15,l:'15\u00d715'},{v:20,l:'20\u00d720 (Hard)'}],
};
function updateSizeOptions() {
  const sel = document.getElementById('size');
  const shape = document.getElementById('shape').value;
  const opts = SIZE_OPTIONS[shape];
  sel.innerHTML = '';
  opts.forEach((o, i) => {
    const opt = document.createElement('option');
    opt.value = o.v; opt.textContent = o.l;
    if (i === Math.min(2, opts.length - 1)) opt.selected = true;
    sel.appendChild(opt);
  });
}
document.getElementById('shape').addEventListener('change', () => { updateSizeOptions(); newGame(); });
updateSizeOptions();

// ===== Web Audio Music Engine =====
let audioCtx = null, musicGain = null, musicPlaying = false;
let musicNodes = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.12;
    musicGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startMusic() {
  initAudio();
  stopMusicNodes();
  const bpm = 140, beatLen = 60 / bpm;
  const now = audioCtx.currentTime + 0.05;
  const bassNotes = [130.81, 130.81, 164.81, 164.81, 110.00, 110.00, 146.83, 146.83];
  const melodyNotes = [523.25, 587.33, 659.25, 523.25, 493.88, 440.00, 493.88, 523.25];
  const loopLen = 8 * beatLen;
  for (let loop = 0; loop < 60; loop++) {
    const loopStart = now + loop * loopLen;
    for (let i = 0; i < 8; i++) {
      const t = loopStart + i * beatLen;
      const bass = audioCtx.createOscillator();
      bass.type = 'square'; bass.frequency.value = bassNotes[i];
      const bg = audioCtx.createGain();
      bg.gain.setValueAtTime(0.3, t);
      bg.gain.exponentialRampToValueAtTime(0.01, t + beatLen * 0.8);
      bass.connect(bg); bg.connect(musicGain);
      bass.start(t); bass.stop(t + beatLen * 0.85);
      musicNodes.push(bass);
      const mel = audioCtx.createOscillator();
      mel.type = 'square'; mel.frequency.value = melodyNotes[i];
      const mg = audioCtx.createGain();
      mg.gain.setValueAtTime(0.15, t + beatLen * 0.5);
      mg.gain.exponentialRampToValueAtTime(0.01, t + beatLen * 1.2);
      mel.connect(mg); mg.connect(musicGain);
      mel.start(t + beatLen * 0.5); mel.stop(t + beatLen * 1.3);
      musicNodes.push(mel);
    }
  }
  musicPlaying = true;
  document.getElementById('musicBtn').style.opacity = '1';
}

function stopMusicNodes() { musicNodes.forEach(n => { try { n.stop(); } catch(_){} }); musicNodes = []; }
function stopMusic() { stopMusicNodes(); musicPlaying = false; document.getElementById('musicBtn').style.opacity = '0.4'; }
function toggleMusic() { initAudio(); if (musicPlaying) stopMusic(); else startMusic(); }

function playSound(freq, dur, type) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function playMoveSound() { playSound(440, 0.05, 'sine'); }
function playPowerUpSound() { [660,880,1100].forEach((f,i) => setTimeout(() => playSound(f,0.12,'sine'), i*80)); }
function playWinSound() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playSound(f,0.2,'square'), i*120)); }
function playDeathSound() { [400,300,200,100].forEach((f,i) => setTimeout(() => playSound(f,0.25,'sawtooth'), i*100)); }

// ===== Game State =====
let maze, totalVertices;
let playerVertex, goalVertex;
let enemies = [];
let moveCount = 0;
let timerStart = 0, timerInterval = null;
let gameOver = false, gameWon = false;
let gameStarted = false;
let enemyTickCounter = 0, enemySpeed = 5;
const ENEMY_RANDOM_CHANCE = 0.65; // 65% random moves = much dumber
let hintTimeout = null, showingHint = false;
let gameTickInterval = null;
let animFrame = 0;
let lives = 3;
let powerPellets = []; // vertex indices where pellets are
let enemyFrozenUntil = 0; // timestamp when freeze ends
const FREEZE_DURATION = 4000; // 4 seconds freeze
let respawning = false; // brief invincibility after respawn
let respawnUntil = 0;
const RESPAWN_INVINCIBLE = 1500; // 1.5s invincible after respawn

// Graph-based data
let passableNeighbors = []; // passableNeighbors[v] = [neighbor vertices]
let cellPos = [];           // cellPos[v] = {x, y} in canvas coords
let wallSegments = [];      // [{x1,y1,x2,y2}] in canvas coords for LineBorder walls
let arcSegments = [];       // [{cx,cy,r,t1,t2}] in canvas coords for ArcBorder walls

// Movement (direction queuing / Pac-Man style)
let inputAngle = null;      // queued direction from input (radians)
let moveAngle = null;       // direction currently moving (radians)
let lastMoveAngle = 0;      // for pac-man mouth rendering

// Smooth animation
let playerAnimX = 0, playerAnimY = 0;
let enemyAnims = [];
const LERP_SPEED = 0.25;

// Coordinate transform
let txScale = 1, txOffX = 0, txMaxY = 0, txPad = 1;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function toCanvasX(mx) { return (mx - txOffX + txPad) * txScale; }
function toCanvasY(my) { return (txMaxY + txPad - my) * txScale; }

function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

// ===== Build game graph from maze =====
function buildGameGraph() {
  totalVertices = maze.vertices;
  const [xmin, ymin, xmax, ymax] = maze.getCoordinateBounds();
  txOffX = xmin; txMaxY = ymax; txPad = 1;
  const w = xmax - xmin + 2 * txPad, h = ymax - ymin + 2 * txPad;
  const area = document.querySelector('.game-area');
  const maxW = area.clientWidth - 16, maxH = area.clientHeight - 16;
  txScale = Math.min(maxW / w, maxH / h);
  canvas.width = Math.round(w * txScale);
  canvas.height = Math.round(h * txScale);

  // Cell positions in canvas coords
  cellPos = [];
  for (let v = 0; v < totalVertices; v++) {
    try {
      const [mx, my] = maze.getCellCenter(v);
      cellPos[v] = { x: toCanvasX(mx), y: toCanvasY(my) };
    } catch (_) {
      cellPos[v] = { x: 0, y: 0 };
    }
  }

  // Save all original neighbors before generation removes edges
  // (must be called BEFORE generateMaze)
  // Actually this is called after, so we use a different approach:
  // passableNeighbors is built in newGame before this function
}

function buildPassability() {
  // Save full neighbor list, generate maze, then compute passability
  // This is called from newGame with the right sequencing
}

function buildWallSegments() {
  wallSegments = [];
  arcSegments = [];
  const seen = new Set();
  for (let v = 0; v < totalVertices; v++) {
    for (const edge of maze.adjacencylist[v]) {
      const border = edge[1];
      if (seen.has(border)) continue;
      seen.add(border);
      if (border.r !== undefined) {
        // ArcBorder
        const cx = toCanvasX(border.cx);
        const cy = toCanvasY(border.cy);
        const r = border.r * txScale;
        arcSegments.push({ cx, cy, r, t1: -border.theta2, t2: -border.theta1 });
      } else {
        // LineBorder
        wallSegments.push({
          x1: toCanvasX(border.x1), y1: toCanvasY(border.y1),
          x2: toCanvasX(border.x2), y2: toCanvasY(border.y2)
        });
      }
    }
  }
}

// ===== Movement =====
function findNeighborInDirection(vertex, angle) {
  const neighbors = passableNeighbors[vertex];
  if (!neighbors || neighbors.length === 0) return null;
  let best = -1, bestDiff = Math.PI / 2; // max 90 degree deviation
  for (const n of neighbors) {
    const dx = cellPos[n].x - cellPos[vertex].x;
    const dy = cellPos[n].y - cellPos[vertex].y;
    const a = Math.atan2(dy, dx);
    const diff = Math.abs(angleDiff(angle, a));
    if (diff < bestDiff) { bestDiff = diff; best = n; }
  }
  return best >= 0 ? best : null;
}

// ===== BFS (graph-based) =====
function bfsNextStep(fromV, toV) {
  if (fromV === toV) return null;
  const visited = new Uint8Array(totalVertices);
  const parent = new Int32Array(totalVertices).fill(-1);
  const queue = [fromV];
  visited[fromV] = 1;
  while (queue.length > 0) {
    const v = queue.shift();
    if (v === toV) {
      let u = toV;
      while (parent[u] !== fromV && parent[u] !== -1) u = parent[u];
      return parent[u] === -1 ? null : u;
    }
    for (const n of passableNeighbors[v]) {
      if (!visited[n]) {
        visited[n] = 1;
        parent[n] = v;
        queue.push(n);
      }
    }
  }
  return null;
}

function randomPassableNeighbor(vertex) {
  const n = passableNeighbors[vertex];
  if (!n || n.length === 0) return null;
  return n[Math.floor(Math.random() * n.length)];
}

// ===== Rendering =====
function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  const theme = getTheme(document.getElementById('theme').value);
  animFrame++;

  // Lerp positions
  const tpx = cellPos[playerVertex].x, tpy = cellPos[playerVertex].y;
  playerAnimX = lerp(playerAnimX, tpx, LERP_SPEED);
  playerAnimY = lerp(playerAnimY, tpy, LERP_SPEED);
  for (let i = 0; i < enemies.length; i++) {
    const ex = cellPos[enemies[i].vertex].x, ey = cellPos[enemies[i].vertex].y;
    enemyAnims[i].x = lerp(enemyAnims[i].x, ex, LERP_SPEED);
    enemyAnims[i].y = lerp(enemyAnims[i].y, ey, LERP_SPEED);
  }

  // Background
  ctx.fillStyle = theme.backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hint
  if (showingHint) drawSolutionHint(theme);

  // Walls
  ctx.strokeStyle = theme.wallColor;
  ctx.lineWidth = Math.max(2, txScale / 10);
  ctx.lineCap = 'round';
  for (const w of wallSegments) {
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
  }
  for (const a of arcSegments) {
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r, a.t1, a.t2); ctx.stroke();
  }

  // Power pellets (glowing dots)
  const pelletR = Math.max(3, txScale * 0.15);
  const frozen = Date.now() < enemyFrozenUntil;
  for (const pv of powerPellets) {
    const px = cellPos[pv].x, py = cellPos[pv].y;
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = pelletR * 2;
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(Date.now() / 250 + pv);
    ctx.beginPath(); ctx.arc(px, py, pelletR, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // Goal (pulsing)
  const gx = cellPos[goalVertex].x, gy = cellPos[goalVertex].y;
  const gr = Math.max(4, txScale * 0.3);
  ctx.fillStyle = theme.solutionColor;
  ctx.globalAlpha = 0.3 + 0.15 * Math.sin(Date.now() / 300);
  ctx.beginPath(); ctx.arc(gx, gy, gr * 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = theme.solutionColor;
  ctx.beginPath(); ctx.arc(gx, gy, gr * 0.5, 0, Math.PI * 2); ctx.fill();

  // Enemies (ghosts) - turn blue when frozen
  const ghostR = Math.max(4, txScale * 0.3);
  for (let i = 0; i < enemies.length; i++) {
    const ex = enemyAnims[i].x, ey = enemyAnims[i].y;
    const sz = ghostR;
    const eColor = frozen ? '#4444ff' : enemies[i].color;
    ctx.fillStyle = eColor;
    ctx.shadowColor = eColor;
    ctx.shadowBlur = sz;
    if (frozen) ctx.globalAlpha = 0.5 + 0.2 * Math.sin(Date.now() / 200);
    ctx.beginPath();
    ctx.arc(ex, ey - sz * 0.2, sz, Math.PI, 0);
    ctx.lineTo(ex + sz, ey + sz * 0.5);
    for (let w = 0; w < 3; w++) {
      const wx1 = ex + sz - (w * 2 + 1) * sz / 3;
      const wx2 = ex + sz - (w * 2 + 2) * sz / 3;
      ctx.quadraticCurveTo(wx1, ey + sz * 0.9, wx2, ey + sz * 0.5);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    // Eyes
    ctx.fillStyle = frozen ? '#aaf' : '#fff';
    ctx.beginPath(); ctx.arc(ex - sz * 0.3, ey - sz * 0.25, sz * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + sz * 0.3, ey - sz * 0.25, sz * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = frozen ? '#44f' : '#000';
    ctx.beginPath(); ctx.arc(ex - sz * 0.25, ey - sz * 0.2, sz * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + sz * 0.35, ey - sz * 0.2, sz * 0.1, 0, Math.PI * 2); ctx.fill();
  }

  // Player (pac-man) - flicker during invincibility
  const invincible = Date.now() < respawnUntil;
  const pColor = theme.breakColor || '#00ffff';
  const pr = Math.max(4, txScale * 0.25);
  if (!invincible || Math.floor(Date.now() / 100) % 2 === 0) {
    ctx.fillStyle = pColor;
    ctx.shadowColor = pColor;
    ctx.shadowBlur = pr * 1.5;
    ctx.beginPath(); ctx.arc(playerAnimX, playerAnimY, pr, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Mouth
    if (moveAngle !== null) {
      ctx.fillStyle = theme.backgroundColor;
      const mouth = 0.3 + 0.1 * Math.sin(animFrame * 0.3);
      ctx.beginPath();
      ctx.moveTo(playerAnimX, playerAnimY);
      ctx.arc(playerAnimX, playerAnimY, pr * 1.05, lastMoveAngle - mouth, lastMoveAngle + mouth);
      ctx.closePath(); ctx.fill();
    }
  }

  // Compass arrow toward goal
  if (gameStarted && !gameOver && !gameWon) {
    const cdx = gx - playerAnimX, cdy = gy - playerAnimY;
    const cDist = Math.sqrt(cdx * cdx + cdy * cdy);
    if (cDist > pr * 3) { // only show if goal is not very close
      const ca = Math.atan2(cdy, cdx);
      const arrowDist = pr * 2.2;
      const ax = playerAnimX + Math.cos(ca) * arrowDist;
      const ay = playerAnimY + Math.sin(ca) * arrowDist;
      const arrowSz = pr * 0.5;
      ctx.fillStyle = theme.solutionColor;
      ctx.globalAlpha = 0.4 + 0.15 * Math.sin(Date.now() / 500);
      ctx.beginPath();
      ctx.moveTo(ax + Math.cos(ca) * arrowSz, ay + Math.sin(ca) * arrowSz);
      ctx.lineTo(ax + Math.cos(ca + 2.4) * arrowSz, ay + Math.sin(ca + 2.4) * arrowSz);
      ctx.lineTo(ax + Math.cos(ca - 2.4) * arrowSz, ay + Math.sin(ca - 2.4) * arrowSz);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Ready screen
  if (!gameStarted && !gameOver && !gameWon) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    const fontSize = Math.max(14, Math.min(canvas.width, canvas.height) * 0.08);
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('READY', canvas.width / 2, canvas.height / 2 - fontSize * 0.8);
    ctx.font = `${fontSize * 0.55}px sans-serif`;
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(Date.now() / 400);
    ctx.fillText('Swipe or press arrow to start', canvas.width / 2, canvas.height / 2 + fontSize * 0.5);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  }

  if (!gameOver && !gameWon) requestAnimationFrame(draw);
}

function drawSolutionHint(theme) {
  ctx.strokeStyle = theme.solutionColor;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(2, txScale / 5);
  ctx.lineCap = 'round';
  for (let u = 0; u < totalVertices; u++) {
    if (!maze.solution[u]) continue;
    for (const edge of maze.solution[u]) {
      const v = edge[0];
      ctx.beginPath();
      ctx.moveTo(cellPos[u].x, cellPos[u].y);
      ctx.lineTo(cellPos[v].x, cellPos[v].y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ===== Game Tick =====
const TICK_MS = 180;

function gameTick() {
  if (gameOver || gameWon || !gameStarted) return;

  // Move player: try queued direction first, then continue in current direction
  let moved = false;
  if (inputAngle !== null) {
    const target = findNeighborInDirection(playerVertex, inputAngle);
    if (target !== null) {
      const dx = cellPos[target].x - cellPos[playerVertex].x;
      const dy = cellPos[target].y - cellPos[playerVertex].y;
      lastMoveAngle = Math.atan2(dy, dx);
      moveAngle = inputAngle;
      playerVertex = target;
      moved = true;
    }
  }
  if (!moved && moveAngle !== null) {
    const target = findNeighborInDirection(playerVertex, moveAngle);
    if (target !== null) {
      const dx = cellPos[target].x - cellPos[playerVertex].x;
      const dy = cellPos[target].y - cellPos[playerVertex].y;
      lastMoveAngle = Math.atan2(dy, dx);
      playerVertex = target;
      moved = true;
    }
  }
  if (moved) {
    moveCount++;
    document.getElementById('moves').textContent = moveCount;
    playMoveSound();

    // Check power pellet collection
    const pelletIdx = powerPellets.indexOf(playerVertex);
    if (pelletIdx !== -1) {
      powerPellets.splice(pelletIdx, 1);
      enemyFrozenUntil = Date.now() + FREEZE_DURATION;
      playSound(880, 0.15, 'sine');
      playSound(1100, 0.15, 'sine');
    }
  }

  // Enemy AI - skip if frozen
  const frozen = Date.now() < enemyFrozenUntil;
  if (!frozen) {
    enemyTickCounter++;
    if (enemyTickCounter >= enemySpeed) {
      enemyTickCounter = 0;
      for (const enemy of enemies) {
        let next;
        if (Math.random() < ENEMY_RANDOM_CHANCE) {
          next = randomPassableNeighbor(enemy.vertex);
        } else {
          next = bfsNextStep(enemy.vertex, playerVertex);
        }
        if (next !== null && next !== undefined) enemy.vertex = next;
      }
    }
  }

  // Collision (skip during invincibility)
  const invincible = Date.now() < respawnUntil;
  if (!invincible && !frozen) {
    for (const enemy of enemies) {
      if (enemy.vertex === playerVertex) { playerCaught(); return; }
    }
  }
  // Win
  if (playerVertex === goalVertex) winGame();
}

function setInputAngle(angle) {
  if (gameOver || gameWon) return;
  if (!gameStarted) {
    gameStarted = true;
    timerStart = Date.now();
    timerInterval = setInterval(updateTimer, 200);
  }
  inputAngle = angle;
}

function winGame() {
  gameWon = true;
  clearInterval(gameTickInterval);
  clearInterval(timerInterval);
  stopMusic();
  playWinSound();
  document.getElementById('endEmoji').textContent = '\u{1F3C6}';
  document.getElementById('endTitle').textContent = 'You Made It!';
  document.getElementById('winTime').textContent = document.getElementById('timer').textContent;
  document.getElementById('winMoves').textContent = moveCount;
  setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 400);
}

function playerCaught() {
  lives--;
  updateLivesDisplay();
  playDeathSound();
  if (lives <= 0) {
    // Game over
    gameOver = true;
    clearInterval(gameTickInterval);
    clearInterval(timerInterval);
    stopMusic();
    document.getElementById('endEmoji').textContent = '\u{1F47B}';
    document.getElementById('endTitle').textContent = 'Game Over!';
    document.getElementById('winTime').textContent = document.getElementById('timer').textContent;
    document.getElementById('winMoves').textContent = moveCount;
    setTimeout(() => {
      draw();
      document.getElementById('winOverlay').classList.add('show');
    }, 500);
  } else {
    // Respawn player at start, keep enemies where they are
    playerVertex = maze.startvertex;
    inputAngle = null; moveAngle = null;
    playerAnimX = cellPos[playerVertex].x;
    playerAnimY = cellPos[playerVertex].y;
    respawnUntil = Date.now() + RESPAWN_INVINCIBLE;
  }
}

function updateLivesDisplay() {
  const el = document.getElementById('lives');
  el.textContent = '\u2764'.repeat(lives) + '\u2661'.repeat(Math.max(0, 3 - lives));
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  document.getElementById('timer').textContent = m + ':' + String(s).padStart(2, '0');
}

function showHint() {
  if (gameOver || gameWon) return;
  showingHint = true;
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => { showingHint = false; }, 2000);
}

// ===== Enemy Spawning =====
function spawnEnemies(count) {
  enemies = [];
  enemyAnims = [];
  const colors = ['#ff4444', '#ff8800', '#ff44ff'];

  // BFS from player to get distances
  const dist = new Int32Array(totalVertices).fill(-1);
  const queue = [playerVertex];
  dist[playerVertex] = 0;
  let maxDist = 0;
  while (queue.length) {
    const v = queue.shift();
    for (const n of passableNeighbors[v]) {
      if (dist[n] === -1) {
        dist[n] = dist[v] + 1;
        if (dist[n] > maxDist) maxDist = dist[n];
        queue.push(n);
      }
    }
  }

  // Pick vertices at ~40-60% of max distance, spread apart
  const targetDist = Math.floor(maxDist * 0.5);
  const candidates = [];
  for (let v = 0; v < totalVertices; v++) {
    if (v !== playerVertex && v !== goalVertex && Math.abs(dist[v] - targetDist) <= Math.max(2, maxDist * 0.1)) {
      candidates.push(v);
    }
  }

  // Pick count enemies spread apart
  for (let i = 0; i < count && candidates.length > 0; i++) {
    const idx = Math.floor(i * candidates.length / count);
    const v = candidates[Math.min(idx, candidates.length - 1)];
    enemies.push({ vertex: v, color: colors[i % colors.length] });
    enemyAnims.push({ x: cellPos[v].x, y: cellPos[v].y });
  }
}

// ===== New Game =====
function newGame() {
  document.getElementById('winOverlay').classList.remove('show');
  clearInterval(gameTickInterval);
  clearInterval(timerInterval);

  const shape = document.getElementById('shape').value;
  const size = parseInt(document.getElementById('size').value);
  const seed = (Math.random() * 0xffffffff) >>> 0;

  // Create maze
  if (shape === 'hex') {
    maze = new HexagonalMaze(size);
  } else {
    maze = new RectangularMaze(size, size);
  }
  maze.initializeGraph();

  // Save all original neighbors BEFORE generation
  const originalNeighbors = [];
  for (let v = 0; v < maze.vertices; v++) {
    originalNeighbors[v] = [];
    for (const edge of maze.adjacencylist[v]) {
      if (edge[0] >= 0) originalNeighbors[v].push(edge[0]);
    }
  }

  // Generate
  const algo = new Kruskal(seed);
  maze.generateMaze(algo);

  // Build passable neighbors (edges that were removed = passable paths)
  passableNeighbors = [];
  for (let v = 0; v < maze.vertices; v++) {
    const wallSet = new Set(maze.adjacencylist[v].map(e => e[0]));
    passableNeighbors[v] = originalNeighbors[v].filter(n => !wallSet.has(n));
  }

  // Set up coordinates and cell positions
  buildGameGraph();
  buildWallSegments();

  // Player/goal vertices
  playerVertex = maze.startvertex;
  goalVertex = maze.endvertex;

  // Reset state
  moveCount = 0; gameOver = false; gameWon = false; gameStarted = false;
  showingHint = false; enemyTickCounter = 0;
  inputAngle = null; moveAngle = null; lastMoveAngle = 0;
  lives = 3; enemyFrozenUntil = 0; respawnUntil = 0;
  updateLivesDisplay();
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';

  // Enemy speed based on maze size (higher = slower enemies)
  const n = maze.vertices;
  enemySpeed = n <= 50 ? 6 : n <= 100 ? 5 : n <= 200 ? 4 : 3;

  // Scatter power pellets along the maze (not at start/goal)
  powerPellets = [];
  const pelletCount = Math.max(2, Math.floor(n / 25));
  const pelletCandidates = [];
  for (let v = 0; v < n; v++) {
    if (v !== playerVertex && v !== goalVertex && passableNeighbors[v].length >= 2) {
      pelletCandidates.push(v);
    }
  }
  // Spread them out evenly
  for (let i = 0; i < pelletCount && pelletCandidates.length > 0; i++) {
    const idx = Math.floor((i + 0.5) * pelletCandidates.length / pelletCount);
    powerPellets.push(pelletCandidates[idx]);
  }

  // Spawn enemies
  const enemyCount = parseInt(document.getElementById('enemyCount').value);
  spawnEnemies(enemyCount);

  // Init animation positions
  playerAnimX = cellPos[playerVertex].x;
  playerAnimY = cellPos[playerVertex].y;

  // Start game tick
  gameTickInterval = setInterval(gameTick, TICK_MS);
  if (musicPlaying) startMusic();
  draw();
}

// ===== Input =====

// Keyboard
const KEY_ANGLES = {
  ArrowRight: 0, d: 0,
  ArrowDown: Math.PI / 2, s: Math.PI / 2,
  ArrowLeft: Math.PI, a: Math.PI,
  ArrowUp: -Math.PI / 2, w: -Math.PI / 2,
};
document.addEventListener('keydown', e => {
  if (e.key in KEY_ANGLES) { e.preventDefault(); setInputAngle(KEY_ANGLES[e.key]); }
  if (e.key === ' ') { e.preventDefault(); toggleMusic(); }
});

// Joystick
const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
let joystickActive = false;
const JOYSTICK_RADIUS = 50, JOYSTICK_DEADZONE = 15;

function updateJoystick(clientX, clientY) {
  const rect = joystickZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  let dx = clientX - cx, dy = clientY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > JOYSTICK_RADIUS) { dx = dx / dist * JOYSTICK_RADIUS; dy = dy / dist * JOYSTICK_RADIUS; }
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  if (dist > JOYSTICK_DEADZONE) {
    setInputAngle(Math.atan2(dy, dx));
  }
}

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio(); joystickActive = true;
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
});
document.addEventListener('touchmove', e => {
  if (!joystickActive) return; e.preventDefault();
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!joystickActive) return;
  joystickActive = false;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
});

// Canvas swipe
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  initAudio();
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.abs(dx) < 25 && Math.abs(dy) < 25) return;
  setInputAngle(Math.atan2(dy, dx));
});

// Theme change
document.getElementById('theme').addEventListener('change', () => {
  if (!gameOver && !gameWon) draw();
});

// Resize
window.addEventListener('resize', () => {
  if (!maze) return;
  buildGameGraph();
  buildWallSegments();
  playerAnimX = cellPos[playerVertex].x;
  playerAnimY = cellPos[playerVertex].y;
  for (let i = 0; i < enemies.length; i++) {
    enemyAnims[i].x = cellPos[enemies[i].vertex].x;
    enemyAnims[i].y = cellPos[enemies[i].vertex].y;
  }
  if (!gameOver && !gameWon) draw();
});

// Start
newGame();
</script>
