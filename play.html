<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maze Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0f0f23; color: #fff;
  min-height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
header {
  background: #1a1a2e; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
header h1 { font-size: 1.1em; font-weight: 600; }
.header-stats { display: flex; gap: 16px; font-size: 0.85em; }
.stat { display: flex; align-items: center; gap: 4px; }
.stat-label { opacity: 0.6; font-size: 0.8em; text-transform: uppercase; }
.stat-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.game-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 8px; position: relative;
}
canvas { border-radius: 4px; }
.controls-bar {
  background: #1a1a2e; padding: 8px 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  flex-wrap: wrap;
}
.controls-bar select, .controls-bar input {
  padding: 6px 8px; border: 1px solid #333; border-radius: 6px;
  font-size: 0.85em; background: #16213e; color: #fff;
}
.controls-bar label { font-size: 0.7em; text-transform: uppercase; opacity: 0.6; }
.ctrl-group { display: flex; flex-direction: column; gap: 2px; }
.btn {
  padding: 8px 16px; border: none; border-radius: 6px;
  font-size: 0.85em; font-weight: 600; cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn-play { background: #e94560; color: #fff; }
.btn-hint { background: #16213e; color: #fff; border: 1px solid #333; }
.btn-music { background: #16213e; color: #fff; border: 1px solid #333; min-width: 32px; }
.btn-back { background: transparent; color: #fff; opacity: 0.7; font-size: 0.8em; text-decoration: none; }
.btn-back:hover { opacity: 1; }

/* D-pad */
.dpad {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  width: 160px; height: 160px; display: none;
}
.dpad-btn {
  position: absolute; width: 52px; height: 52px;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 1.4em; color: rgba(255,255,255,0.7); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.dpad-btn:active { background: rgba(255,255,255,0.25); }
.dpad-up { top: 0; left: 50%; transform: translateX(-50%); }
.dpad-down { bottom: 0; left: 50%; transform: translateX(-50%); }
.dpad-left { top: 50%; left: 0; transform: translateY(-50%); }
.dpad-right { top: 50%; right: 0; transform: translateY(-50%); }

/* Overlays */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.overlay.show { display: flex; }
.win-card {
  background: #1a1a2e; border-radius: 16px; padding: 32px 40px;
  text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  max-width: 90vw;
}
.win-card h2 { font-size: 1.8em; margin-bottom: 8px; }
.win-card .win-emoji { font-size: 3em; margin-bottom: 12px; }
.win-stats { margin: 16px 0; font-size: 1.1em; line-height: 1.8; }
.win-stats span { font-weight: 700; color: #e94560; }

@media (hover: none) and (pointer: coarse) {
  .dpad { display: block; }
  .game-area { padding-bottom: 180px; }
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="btn-back">&larr; Back</a>
    <h1>Maze Runner</h1>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timer">0:00</span></div>
    <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
  </div>
</header>
<div class="controls-bar">
  <div class="ctrl-group">
    <label>Size</label>
    <select id="size">
      <option value="5">5 &times; 5 (Easy)</option>
      <option value="8">8 &times; 8</option>
      <option value="10" selected>10 &times; 10</option>
      <option value="15">15 &times; 15</option>
      <option value="20">20 &times; 20 (Hard)</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Theme</label>
    <select id="theme">
      <option value="neon">Neon</option>
      <option value="dungeon">Dungeon</option>
      <option value="midnight">Midnight</option>
      <option value="retro">Retro</option>
      <option value="blueprint">Blueprint</option>
      <option value="ice">Ice</option>
      <option value="classic">Classic</option>
      <option value="parchment">Parchment</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Enemies</label>
    <select id="enemyCount">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
    </select>
  </div>
  <button class="btn btn-play" onclick="newGame()">New Game</button>
  <button class="btn btn-hint" onclick="showHint()">Hint</button>
  <button class="btn btn-music" id="musicBtn" onclick="toggleMusic()">&#9835;</button>
</div>
<div class="game-area">
  <canvas id="canvas"></canvas>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">&uarr;</div>
  <div class="dpad-btn dpad-down" data-dir="down">&darr;</div>
  <div class="dpad-btn dpad-left" data-dir="left">&larr;</div>
  <div class="dpad-btn dpad-right" data-dir="right">&rarr;</div>
</div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji" id="endEmoji">&#127942;</div>
    <h2 id="endTitle">You Made It!</h2>
    <div class="win-stats">
      Time: <span id="winTime">0:00</span><br>
      Moves: <span id="winMoves">0</span>
    </div>
    <button class="btn btn-play" onclick="newGame()" style="margin-top:12px">Play Again</button>
  </div>
</div>

<script src="maze-bundle.js?v=5"></script>
<script>
const { RectangularMaze, Kruskal, getTheme } = MazeGen;

// ===== Web Audio Music Engine =====
let audioCtx = null, musicGain = null, musicPlaying = false;
let musicNodes = [];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.12;
  musicGain.connect(audioCtx.destination);
}

function startMusic() {
  initAudio();
  stopMusicNodes();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Simple chiptune loop using square waves
  const bpm = 140, beatLen = 60 / bpm;
  const now = audioCtx.currentTime + 0.05;

  // Bass line (loop every 8 beats)
  const bassNotes = [130.81, 130.81, 164.81, 164.81, 110.00, 110.00, 146.83, 146.83]; // C3 C3 E3 E3 A2 A2 D3 D3
  // Melody (loop every 8 beats)
  const melodyNotes = [523.25, 587.33, 659.25, 523.25, 493.88, 440.00, 493.88, 523.25]; // C5 D5 E5 C5 B4 A4 B4 C5

  const loopLen = 8 * beatLen;
  const totalLoops = 60; // ~3.5 minutes of music

  for (let loop = 0; loop < totalLoops; loop++) {
    const loopStart = now + loop * loopLen;

    for (let i = 0; i < 8; i++) {
      const t = loopStart + i * beatLen;
      // Bass
      const bass = audioCtx.createOscillator();
      bass.type = 'square';
      bass.frequency.value = bassNotes[i];
      const bassGain = audioCtx.createGain();
      bassGain.gain.setValueAtTime(0.3, t);
      bassGain.gain.exponentialRampToValueAtTime(0.01, t + beatLen * 0.8);
      bass.connect(bassGain); bassGain.connect(musicGain);
      bass.start(t); bass.stop(t + beatLen * 0.85);
      musicNodes.push(bass);

      // Melody (offset by half beat for groove)
      const mel = audioCtx.createOscillator();
      mel.type = 'square';
      mel.frequency.value = melodyNotes[i];
      const melGain = audioCtx.createGain();
      melGain.gain.setValueAtTime(0.15, t + beatLen * 0.5);
      melGain.gain.exponentialRampToValueAtTime(0.01, t + beatLen * 1.2);
      mel.connect(melGain); melGain.connect(musicGain);
      mel.start(t + beatLen * 0.5); mel.stop(t + beatLen * 1.3);
      musicNodes.push(mel);
    }
  }
  musicPlaying = true;
  document.getElementById('musicBtn').style.opacity = '1';
}

function stopMusicNodes() {
  musicNodes.forEach(n => { try { n.stop(); } catch(_){} });
  musicNodes = [];
}

function stopMusic() {
  stopMusicNodes();
  musicPlaying = false;
  document.getElementById('musicBtn').style.opacity = '0.4';
}

function toggleMusic() {
  if (musicPlaying) stopMusic(); else startMusic();
}

// Quick sound effects
function playSound(freq, dur, type) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playMoveSound() { playSound(440, 0.05, 'sine'); }
function playWinSound() {
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playSound(f, 0.2, 'square'), i * 120);
  });
}
function playDeathSound() {
  [400, 300, 200, 100].forEach((f, i) => {
    setTimeout(() => playSound(f, 0.25, 'sawtooth'), i * 100);
  });
}

// ===== Game State =====
let maze, width, height, cellSize;
let playerRow, playerCol, playerDir;
let goalRow, goalCol;
let enemies = [];
let moveCount = 0;
let timerStart = 0, timerInterval = null;
let gameOver = false, gameWon = false;
let hintTimeout = null, showingHint = false;
let gameTickInterval = null;
let passable = [];
let animFrame = 0;

// Smooth animation positions (in pixel coords)
let playerAnimX, playerAnimY;
let enemyAnims = []; // [{x, y}]
const LERP_SPEED = 0.25;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function vertexIndex(r, c) { return r * width + c; }

function buildPassable() {
  passable = [];
  for (let r = 0; r < height; r++) {
    passable[r] = [];
    for (let c = 0; c < width; c++) {
      const v = vertexIndex(r, c);
      const walls = maze.adjacencylist[v];
      const hasWallTo = (nv) => walls.some(e => e[0] === nv);
      passable[r][c] = {
        up:    r > 0          && !hasWallTo(vertexIndex(r - 1, c)),
        down:  r < height - 1 && !hasWallTo(vertexIndex(r + 1, c)),
        left:  c > 0          && !hasWallTo(vertexIndex(r, c - 1)),
        right: c < width - 1  && !hasWallTo(vertexIndex(r, c + 1)),
      };
    }
  }
}

// BFS to find next step from (sr,sc) toward (tr,tc)
function bfsNextStep(sr, sc, tr, tc) {
  if (sr === tr && sc === tc) return null;
  const visited = new Uint8Array(width * height);
  const parent = new Int32Array(width * height).fill(-1);
  const queue = [sr * width + sc];
  visited[sr * width + sc] = 1;
  const target = tr * width + tc;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const dirNames = ['up','down','left','right'];

  while (queue.length > 0) {
    const cur = queue.shift();
    const cr = Math.floor(cur / width), cc = cur % width;
    if (cur === target) {
      // Trace back to find first step
      let v = target;
      while (parent[v] !== sr * width + sc && parent[v] !== -1) v = parent[v];
      if (parent[v] === -1) return null;
      const nr = Math.floor(v / width), nc = v % width;
      return { row: nr, col: nc };
    }
    for (let d = 0; d < 4; d++) {
      if (!passable[cr][cc][dirNames[d]]) continue;
      const nr = cr + dirs[d][0], nc = cc + dirs[d][1];
      const nv = nr * width + nc;
      if (!visited[nv]) {
        visited[nv] = 1;
        parent[nv] = cur;
        queue.push(nv);
      }
    }
  }
  return null;
}

function canMove(r, c, dir) {
  return passable[r] && passable[r][c] && passable[r][c][dir];
}

function calcCellSize() {
  const area = document.querySelector('.game-area');
  const maxW = area.clientWidth - 16;
  const maxH = area.clientHeight - 16;
  cellSize = Math.floor(Math.min(maxW / width, maxH / height));
  cellSize = Math.max(cellSize, 10);
  canvas.width = width * cellSize;
  canvas.height = height * cellSize;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function draw() {
  const theme = getTheme(document.getElementById('theme').value);
  const cw = cellSize;
  animFrame++;

  // Lerp positions
  const targetPX = playerCol * cw + cw / 2;
  const targetPY = playerRow * cw + cw / 2;
  playerAnimX = lerp(playerAnimX, targetPX, LERP_SPEED);
  playerAnimY = lerp(playerAnimY, targetPY, LERP_SPEED);

  for (let i = 0; i < enemies.length; i++) {
    const ex = enemies[i].col * cw + cw / 2;
    const ey = enemies[i].row * cw + cw / 2;
    enemyAnims[i].x = lerp(enemyAnims[i].x, ex, LERP_SPEED);
    enemyAnims[i].y = lerp(enemyAnims[i].y, ey, LERP_SPEED);
  }

  // Background
  ctx.fillStyle = theme.backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hint
  if (showingHint) drawSolutionHint(theme);

  // Walls
  ctx.strokeStyle = theme.wallColor;
  ctx.lineWidth = Math.max(2, cw / 10);
  ctx.lineCap = 'round';
  for (let r = 0; r < height; r++) {
    for (let c = 0; c < width; c++) {
      const x = c * cw, y = r * cw;
      const p = passable[r][c];
      if (!p.up)   { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cw, y); ctx.stroke(); }
      if (!p.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cw); ctx.stroke(); }
      if (c === width - 1)  { ctx.beginPath(); ctx.moveTo(x + cw, y); ctx.lineTo(x + cw, y + cw); ctx.stroke(); }
      if (r === height - 1) { ctx.beginPath(); ctx.moveTo(x, y + cw); ctx.lineTo(x + cw, y + cw); ctx.stroke(); }
    }
  }

  // Goal marker (pulsing)
  const gx = goalCol * cw + cw / 2, gy = goalRow * cw + cw / 2;
  ctx.fillStyle = theme.solutionColor;
  ctx.globalAlpha = 0.3 + 0.15 * Math.sin(Date.now() / 300);
  ctx.beginPath(); ctx.arc(gx, gy, cw * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = theme.solutionColor;
  ctx.beginPath(); ctx.arc(gx, gy, cw * 0.15, 0, Math.PI * 2); ctx.fill();

  // Enemies (drawn as spooky triangles/ghosts)
  for (let i = 0; i < enemies.length; i++) {
    const ex = enemyAnims[i].x, ey = enemyAnims[i].y;
    const sz = cw * 0.35;
    // Ghost body
    ctx.fillStyle = enemies[i].color;
    ctx.shadowColor = enemies[i].color;
    ctx.shadowBlur = cw * 0.3;
    ctx.beginPath();
    ctx.arc(ex, ey - sz * 0.2, sz, Math.PI, 0); // top dome
    ctx.lineTo(ex + sz, ey + sz * 0.5);
    // Wavy bottom
    const waves = 3;
    for (let w = 0; w < waves; w++) {
      const wx1 = ex + sz - (w * 2 + 1) * sz / waves;
      const wx2 = ex + sz - (w * 2 + 2) * sz / waves;
      ctx.quadraticCurveTo(wx1, ey + sz * 0.9, wx2, ey + sz * 0.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex - sz * 0.3, ey - sz * 0.25, sz * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + sz * 0.3, ey - sz * 0.25, sz * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ex - sz * 0.25, ey - sz * 0.2, sz * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + sz * 0.35, ey - sz * 0.2, sz * 0.1, 0, Math.PI * 2); ctx.fill();
  }

  // Player (glowing circle with direction indicator)
  const pColor = theme.breakColor || '#00ffff';
  ctx.fillStyle = pColor;
  ctx.shadowColor = pColor;
  ctx.shadowBlur = cw * 0.5;
  ctx.beginPath(); ctx.arc(playerAnimX, playerAnimY, cw * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // Mouth (pac-man style based on direction)
  if (playerDir) {
    ctx.fillStyle = theme.backgroundColor;
    const angles = { right: 0, down: Math.PI/2, left: Math.PI, up: -Math.PI/2 };
    const a = angles[playerDir] || 0;
    const mouth = 0.3 + 0.1 * Math.sin(animFrame * 0.3);
    ctx.beginPath();
    ctx.moveTo(playerAnimX, playerAnimY);
    ctx.arc(playerAnimX, playerAnimY, cw * 0.31, a - mouth, a + mouth);
    ctx.closePath();
    ctx.fill();
  }

  if (!gameOver && !gameWon) requestAnimationFrame(draw);
}

function drawSolutionHint(theme) {
  const cw = cellSize;
  ctx.strokeStyle = theme.solutionColor;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(2, cw / 5);
  ctx.lineCap = 'round';
  for (let u = 0; u < maze.vertices; u++) {
    for (const edge of maze.solution[u]) {
      const v = edge[0];
      const r1 = Math.floor(u / width), c1 = u % width;
      const r2 = Math.floor(v / width), c2 = v % width;
      ctx.beginPath();
      ctx.moveTo(c1 * cw + cw / 2, r1 * cw + cw / 2);
      ctx.lineTo(c2 * cw + cw / 2, r2 * cw + cw / 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ===== Game Tick (movement + enemy AI) =====
const TICK_MS = 180;

function gameTick() {
  if (gameOver || gameWon) return;

  // Move player in current direction (continuous)
  if (playerDir && canMove(playerRow, playerCol, playerDir)) {
    const deltas = { up: [-1,0], down: [1,0], left: [0,-1], right: [0,1] };
    const [dr, dc] = deltas[playerDir];
    playerRow += dr; playerCol += dc;
    moveCount++;
    document.getElementById('moves').textContent = moveCount;
    playMoveSound();
  }

  // Move enemies toward player
  for (const enemy of enemies) {
    const next = bfsNextStep(enemy.row, enemy.col, playerRow, playerCol);
    if (next) {
      enemy.row = next.row;
      enemy.col = next.col;
    }
  }

  // Check collision
  checkCollision();

  // Check win
  if (playerRow === goalRow && playerCol === goalCol) {
    winGame();
  }
}

function checkCollision() {
  for (const enemy of enemies) {
    if (enemy.row === playerRow && enemy.col === playerCol) {
      loseGame();
      return;
    }
  }
}

function setDirection(dir) {
  if (gameOver || gameWon) return;
  playerDir = dir;
}

function winGame() {
  gameWon = true;
  clearInterval(gameTickInterval);
  clearInterval(timerInterval);
  stopMusic();
  playWinSound();
  document.getElementById('endEmoji').textContent = '\u{1F3C6}';
  document.getElementById('endTitle').textContent = 'You Made It!';
  document.getElementById('winTime').textContent = document.getElementById('timer').textContent;
  document.getElementById('winMoves').textContent = moveCount;
  setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 400);
}

function loseGame() {
  gameOver = true;
  clearInterval(gameTickInterval);
  clearInterval(timerInterval);
  stopMusic();
  playDeathSound();
  document.getElementById('endEmoji').textContent = '\u{1F47B}';
  document.getElementById('endTitle').textContent = 'Caught!';
  document.getElementById('winTime').textContent = document.getElementById('timer').textContent;
  document.getElementById('winMoves').textContent = moveCount;
  // Flash player red
  setTimeout(() => {
    draw(); // one last frame
    document.getElementById('winOverlay').classList.add('show');
  }, 500);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('timer').textContent = m + ':' + String(s).padStart(2, '0');
}

function showHint() {
  if (gameOver || gameWon) return;
  showingHint = true;
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => { showingHint = false; }, 2000);
}

function spawnEnemies(count) {
  enemies = [];
  enemyAnims = [];
  const colors = ['#ff4444', '#ff8800', '#ff44ff'];
  // Spawn enemies in the middle region of the maze, away from player
  const midR = Math.floor(height / 2), midC = Math.floor(width / 2);
  const offsets = [
    [0, 0],
    [-Math.floor(height / 4), Math.floor(width / 4)],
    [Math.floor(height / 4), -Math.floor(width / 4)],
  ];
  for (let i = 0; i < count; i++) {
    const or = midR + (offsets[i] ? offsets[i][0] : 0);
    const oc = midC + (offsets[i] ? offsets[i][1] : 0);
    const r = Math.max(1, Math.min(height - 2, or));
    const c = Math.max(1, Math.min(width - 2, oc));
    enemies.push({ row: r, col: c, color: colors[i % colors.length] });
    enemyAnims.push({ x: c * cellSize + cellSize / 2, y: r * cellSize + cellSize / 2 });
  }
}

function newGame() {
  document.getElementById('winOverlay').classList.remove('show');
  clearInterval(gameTickInterval);
  clearInterval(timerInterval);

  const size = parseInt(document.getElementById('size').value);
  width = size; height = size;
  playerRow = 0; playerCol = 0; playerDir = null;
  goalRow = height - 1; goalCol = width - 1;
  moveCount = 0; gameOver = false; gameWon = false; showingHint = false;
  document.getElementById('moves').textContent = '0';

  const seed = (Math.random() * 0xffffffff) >>> 0;
  maze = new RectangularMaze(width, height);
  maze.initializeGraph();
  const algo = new Kruskal(seed);
  maze.generateMaze(algo);

  buildPassable();
  calcCellSize();

  // Spawn enemies
  const enemyCount = parseInt(document.getElementById('enemyCount').value);
  spawnEnemies(enemyCount);

  // Init animation positions
  playerAnimX = playerCol * cellSize + cellSize / 2;
  playerAnimY = playerRow * cellSize + cellSize / 2;

  timerStart = Date.now();
  timerInterval = setInterval(updateTimer, 200);
  document.getElementById('timer').textContent = '0:00';

  // Start game tick
  gameTickInterval = setInterval(gameTick, TICK_MS);

  // Start music if user already enabled it
  initAudio();
  if (musicPlaying) startMusic();

  draw();
}

// ===== Input =====

// Keyboard (set direction, hold to keep moving)
document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right' };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); setDirection(dir); }
  // Space to start music on first interaction
  if (e.key === ' ') { e.preventDefault(); toggleMusic(); }
});

// D-pad
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const handler = e => { e.preventDefault(); initAudio(); setDirection(dir); };
  btn.addEventListener('touchstart', handler);
  btn.addEventListener('mousedown', handler);
});

// Swipe on canvas
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  initAudio();
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
});
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? 'right' : 'left');
  } else {
    setDirection(dy > 0 ? 'down' : 'up');
  }
});

// Theme change
document.getElementById('theme').addEventListener('change', () => {
  if (!gameOver && !gameWon) draw();
});

// Resize
window.addEventListener('resize', () => {
  calcCellSize();
  playerAnimX = playerCol * cellSize + cellSize / 2;
  playerAnimY = playerRow * cellSize + cellSize / 2;
  for (let i = 0; i < enemies.length; i++) {
    enemyAnims[i].x = enemies[i].col * cellSize + cellSize / 2;
    enemyAnims[i].y = enemies[i].row * cellSize + cellSize / 2;
  }
  if (!gameOver && !gameWon) draw();
});

// Start
newGame();
</script>
</body>
</html>
